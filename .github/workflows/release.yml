name: Release

on:
  push:
    branches: [main]
  # Every job here calls a reusable workflow from nivuus/.github@main, so what
  # this means can change with no commit landing in this repository - and it
  # does, often. Without this trigger the only way to ask whether main passes
  # under the current socle is to push something to main, and re-running an
  # old run does not answer it either: a re-run replays the workflow revision
  # it was created with. `gh workflow run <name> --ref main` asks directly.
  workflow_dispatch:

jobs:
  release:
    uses: nivuus/.github/.github/workflows/release.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      # The Node the build, the gate and the bundle run on: engines.node of
      # plateforme/package.json pins 24, and the install hook refuses to
      # drop any other (ubuntu-latest ships 22 - the first run through
      # this chain was refused by its own gate for exactly that).
      node-version: "24"
      # hooks/install.py refuses a source tree without client/dist,
      # plateforme/node_modules/.bin/tsx and proto/ts (its pre-flight lists
      # them all). proto/ts is tracked; the other two are gitignored build
      # outputs, so they are built here and copied into the exported tree
      # before it is archived - git archive alone never ships them, which
      # is why every release up to v1.2.3 was a source snapshot the updater
      # could download but never install.
      build-command: >-
        (cd plateforme && npm ci --no-audit --no-fund)
        && (cd client && npm ci --no-audit --no-fund && npm run build)
      bundle-command: >-
        cp -R client/dist "$EXPORT_DIR/client/dist"
        && cp -R plateforme/node_modules "$EXPORT_DIR/plateforme/node_modules"
      # The idempotence gate runs after the build, against the same files
      # the archive will carry. The fixture holds console's answers too:
      # the harness applies one answers dict to the whole prerequisite
      # chain (see the fixture's own _comment).
      answers-file: tests/fixtures/ci-answers.json
