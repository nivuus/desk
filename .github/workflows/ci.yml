name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Every job here calls a reusable workflow from nivuus/.github@main, so what
  # this means can change with no commit landing in this repository - and it
  # does, often. Without this trigger the only way to ask whether main passes
  # under the current socle is to push something to main, and re-running an
  # old run does not answer it either: a re-run replays the workflow revision
  # it was created with. `gh workflow run <name> --ref main` asks directly.
  workflow_dispatch:

jobs:
  policy:
    uses: nivuus/.github/.github/workflows/policy.yml@main
  security:
    uses: nivuus/.github/.github/workflows/security.yml@main
  # The workspace holds two crates that do not share a target. `proto` is
  # portable. `agent` is a Windows program: its portable modules are reached
  # only from #[cfg(windows)] code, so linting it for Linux reports every one
  # of them as dead (626 errors measured on 2026-09-28, none of them real).
  # The shared job therefore checks formatting for the whole workspace
  # (`cargo fmt --all` follows the workspace from any member's manifest) but
  # lints and tests `proto` alone; `rust-agent` below lints `agent` for its
  # real target and runs its host tests - the same two commands CLAUDE.md
  # gives for local work.
  rust:
    uses: nivuus/.github/.github/workflows/ci-rust.yml@main
    with:
      manifest-path: proto/Cargo.toml
  rust-agent:
    name: Rust agent (Windows target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # x86_64-pc-windows-gnu is the target scripts/build-agent-croise.sh
      # ships agent.exe for, and the build scripts of the C dependencies
      # (opus) need its mingw compiler even for a check.
      - name: Install the Windows target and its mingw toolchain
        run: |
          rustup component add clippy
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy for the Windows target
        run: cargo clippy -p agent --target x86_64-pc-windows-gnu --all-targets -- -D warnings

      # The #[cfg(windows)] code cannot run on a Linux runner; everything
      # else in the agent is tested here, on the host, as it is locally.
      - name: Run the agent's host tests
        run: cargo test -p agent --all-targets
  node:
    uses: nivuus/.github/.github/workflows/ci-node.yml@main
  shell:
    uses: nivuus/.github/.github/workflows/ci-shell.yml@main
    with:
      test-dirs: ""
      shellcheck-paths: "."
      # docs/superpowers/plans/*/instrument/ holds the scripts executed plans
      # actually ran, kept beside the measurements they produced. 65 of this
      # repository's 75 shell scripts live there, and 28 of them fail
      # `shellcheck -S warning`: 18 unicode quotes, 15 unused variables, 7
      # missing shebangs, 6 bare cds. None of those is a defect - they are
      # facts about a run that already happened, and editing an archived
      # script to satisfy a linter edits the record of what was run. The ten
      # scripts under scripts/ ARE code and stay in the scan; the path stays
      # "." so anything new outside docs/ is checked without being listed.
      shellcheck-exclude: "./docs/*"
  # The package/Package contract job (ci-package.yml) is NOT wired here: it
  # runs the idempotence harness against a bare checkout, and desk's install
  # hook refuses a tree without client/dist and
  # plateforme/node_modules/.bin/tsx, both gitignored build outputs that
  # ci-package.yml has no step to produce. Wiring it would ship a
  # permanently red control. The gate DOES run on every merge to main, in
  # release.yml: the shared release workflow builds those outputs first
  # (build-command), proves the hook against them, then copies them into the
  # published archive (bundle-command). tests/fixtures/ci-answers.json is
  # the answers file that gate uses - keep it.
