<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spike — origin hygiene</title>
    <style>
        body { font: 16px/1.5 system-ui, sans-serif; max-width: 46rem; margin: 3rem auto; padding: 0 1rem; }
        pre { background: #f4f4f5; padding: 1rem; border-radius: .5rem; overflow-x: auto; }
        .vide { color: #71717a; font-style: italic; }
        .echec { background: #fee2e2; color: #7f1d1d; border: 2px solid #b91c1c; }
        .propre { background: #dcfce7; color: #14532d; }
    </style>
</head>
<body>
    <h1>Step 0 — origin hygiene</h1>
    <p>
        Unregisters every service worker and empties every cache of
        <code id="origin"></code>, then displays what was found.
    </p>
    <button id="nettoyer">Clean the origin</button>
    <h2>Found then removed</h2>
    <pre id="rapport" class="vide">Not run yet.</pre>
    <p>
        Then: manually uninstall the old PWA if it is present
        (browser menu → Apps), then go back to <a href="/">the main
        page</a>.
    </p>
    <script type="module">
        import { nettoyerOrigin } from './lib/reset-origin.js';

        document.getElementById('origin').textContent = location.origin;

        const sortie = document.getElementById('rapport');

        function afficher(texte, classe) {
            sortie.className = classe;
            sortie.textContent = texte;
        }

        document.getElementById('nettoyer').addEventListener('click', async () => {
            // Without this try/catch, an exception from getRegistrations() or from
            // caches.keys() left the <pre> on "Not run yet.": a
            // failure indistinguishable from a display defect. The operator then carried on
            // with the service worker of the old application still
            // active, which intercepts the spike requests and makes ALL the
            // verdicts uninterpretable. It is the highest-leverage contamination
            // point of the instrument: it must shout, not keep quiet.
            try {
                afficher('Cleaning up…', 'vide');
                const rapport = await nettoyerOrigin({
                    serviceWorker: navigator.serviceWorker,
                    caches: window.caches,
                });

                // Reading AFTERWARDS: we report an observed state, not only
                // an attempted action. An unregister() returning `true` does not guarantee
                // that the origin is clean.
                const restants = navigator.serviceWorker
                    ? (await navigator.serviceWorker.getRegistrations()).map((e) => e.scope)
                    : [];
                const cachesRestants = window.caches ? await window.caches.keys() : [];
                const propre = restants.length === 0 && cachesRestants.length === 0;

                afficher(
                    JSON.stringify({ ...rapport, restants, cachesRestants, propre }, null, 2) +
                    (propre
                        ? '\n\n✓ Origin clean — you can move on.'
                        : '\n\n✗ Origin NOT clean: service workers or caches remain. ' +
                          'Do not run any variant — the verdicts would be uninterpretable. ' +
                          'Uninstall the old PWA, then run this clean-up again.'),
                    propre ? 'propre' : 'echec',
                );
                console.log('[spike] origin hygiene', { rapport, restants, cachesRestants, propre });
            } catch (erreur) {
                afficher(
                    `✗ The clean-up FAILED: ${erreur?.stack ?? erreur}\n\n` +
                    'The origin is in an unknown state. Do not run any variant until this ' +
                    'clean-up has succeeded: a service worker of the old application ' +
                    'would intercept the spike requests.',
                    'echec',
                );
                console.error('[spike] origin hygiene — failure', erreur);
            }
        });
    </script>
</body>
</html>
