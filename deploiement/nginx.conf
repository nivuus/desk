# Le proxy inverse du sous-projet ⑤ Plateforme.
#
# Il fait trois choses, et une seule origine les réunit : il termine TLS, il
# sert la page, et il relaie l'API et les deux WebSockets vers le service.
#
# ⚠️ CE FICHIER N'EST COUVERT PAR AUCUN TEST UNITAIRE — c'est une configuration
# nginx, pas du code. Ce qui le juge est le critère ⑤ de la recette, dans un
# NAVIGATEUR RÉEL : une CSP fautive ne se voit ni en TypeScript, ni en Node.
# `client/src/cors.ts` écrit déjà cette phrase pour son propre sujet.

# ⚠️ PAS DE `daemon off;` ICI, ET C'EST MESURÉ, PAS SUPPOSÉ. L'image
# `nginx:alpine` le pose déjà elle-même, et le redéclarer fait ÉCHOUER LE
# DÉMARRAGE : « "daemon" directive is duplicate ». Relevé le 21 août 2026 —
# et `nginx -t` NE LE VOIT PAS, parce qu'il n'applique pas la ligne de commande
# de l'image. Une configuration dont la syntaxe est déclarée « ok » peut donc
# refuser de démarrer : seule l'exécution réelle le dit.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    server_tokens off;   # ne pas annoncer la version de nginx

    # L'en-tête `Connection` d'une montée WebSocket doit valoir `upgrade`, et
    # celui d'une requête ordinaire doit rester vide — pas « close », qui
    # couperait la réutilisation de connexion vers l'amont.
    map $http_upgrade $connexion_amont {
        default  "";
        websocket "upgrade";
    }

    # ── LES EN-TÊTES VERS L'AMONT : DÉCLARÉS ICI, ET NULLE PART AILLEURS ────
    #
    # 🔴 NE JAMAIS RE-DÉCLARER UN `proxy_set_header` DANS UN `server` OU UN
    # `location`. NGINX N'HÉRITE PAS PAR FUSION MAIS PAR REMPLACEMENT : dès
    # qu'un bloc plus profond en déclare UN SEUL, il perd TOUS ceux du niveau
    # au-dessus.
    #
    # CE N'EST PAS UNE PRÉCAUTION THÉORIQUE — C'EST MESURÉ, ET ÇA A CASSÉ CE
    # FICHIER. Le 21 août 2026, une rédaction antérieure posait
    # `X-Forwarded-For` dans le `server` et `Upgrade`/`Connection` dans
    # `location = /agent`. Un vrai agent branché derrière ce proxy a reçu :
    #
    #     {"chemin":"/agent","xff":null,"proto":null}
    #
    # **`X-Forwarded-For` ÉTAIT ABSENT.** Le service aurait donc vu l'adresse du
    # proxy pour TOUS les agents, et le frein par adresse aurait dégénéré en
    # frein GLOBAL — précisément la panne que l'invariant ③ du runbook décrit.
    # `nginx -t` déclarait pourtant la configuration « ok » : seule une montée
    # WebSocket réelle, lue à l'AMONT, l'a révélée.
    #
    # `Upgrade` et `Connection` sont inoffensifs pour une requête ordinaire :
    # `$http_upgrade` y est vide, donc `$connexion_amont` vaut la chaîne vide.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # 🔴 `X-Forwarded-For` EST L'UNIQUE SOURCE D'ADRESSE DU CLIENT une fois le
    # proxy en place. `$proxy_add_x_forwarded_for` AJOUTE `$remote_addr` à
    # l'en-tête reçu plutôt que de le remplacer — c'est pourquoi
    # `plateforme/src/http/adresse-source.ts` lit le DERNIER élément de la
    # liste, le seul que ce proxy-ci a écrit, et non le premier, qui est ce que
    # le client a bien voulu prétendre.
    #
    # ⚠️ ET C'EST POURQUOI `PLATEFORME_PROXY_DE_CONFIANCE` DOIT PORTER
    # L'ADRESSE DE CE PROXY : le service ne croit cet en-tête que d'un pair qui
    # y figure. Voir `deploiement/README.md`, invariant ③.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connexion_amont;
    # 🔴 L'EN-TÊTE D'IDENTITÉ EST EFFACÉ, ET SANS LUI CE PROFIL EST UN
    # CONTOURNEMENT COMPLET DE L'AUTHENTIFICATION. `X-Pomerium-Claim-Email` est
    # ce que `plateforme/src/http/routes-identite.ts` échange contre un jeton
    # interne, SANS vérifier aucune signature (arbitrage ② de la spec). Le proxy
    # de CE profil est nginx, pas Pomerium : rien ici ne pose cet en-tête, donc
    # sans cette ligne celui qu'un client envoie traverse VERBATIM, et
    # `curl -k https://<hôte>/auth/moi -H 'X-Pomerium-Claim-Email: n-importe@qui'`
    # rend un jeton valide et CRÉE le compte. Une valeur vide fait que nginx ne
    # transmet pas l'en-tête du tout.
    #
    # 🔴 CETTE LIGNE ET `PLATEFORME_AUTH: motdepasse` DE
    # `docker-compose.plateforme.yml` VONT ENSEMBLE, ET S'INVERSENT ENSEMBLE.
    # ⚠️ IL EST FAUX DE CROIRE QUE CETTE LIGNE « RESTERAIT JUSTE » LE JOUR OÙ CE
    # PROFIL PASSERAIT DERRIÈRE POMERIUM : `proxy_set_header … "";` efface
    # l'en-tête ENTRANT, donc effacerait AUSSI celui que Pomerium poserait, et
    # `/auth/moi` ne verrait jamais aucune identité. Ce jour-là il faut faire
    # les DEUX gestes : RETIRER cette directive **et** passer la variable à
    # `pomerium`. N'en appliquer qu'une moitié donne, dans un sens, un service
    # que personne ne peut plus atteindre, et dans l'autre, la porte ouverte
    # décrite ci-dessus.
    #
    # ⚠️ ELLE EST ICI, AU NIVEAU `http`, AVEC LES SIX AUTRES, ET JAMAIS DANS UN
    # `location` : nginx n'hérite pas par fusion mais par REMPLACEMENT — voir
    # l'encadré au-dessus, que ce fichier a déjà payé une fois.
    proxy_set_header X-Pomerium-Claim-Email "";

    proxy_http_version 1.1;
    # Un flux vidéo n'a rien à gagner à être bufferisé, et l'API non plus.
    proxy_buffering    off;

    # ── UNE SEULE CIBLE AMONT, ET C'EST UNE CONTRAINTE DE CORRECTION ─────────
    #
    # 🔴 NE JAMAIS AJOUTER UN SECOND `server` ICI. Trois états de routage vivent
    # en mémoire du processus `plateforme` :
    #
    #     signaling/appariement.ts   la table des sessions et leurs deux pairs
    #     signaling/propriete.ts     qui possède quel nom de session
    #     securite/frein.ts          les échecs récents
    #
    # À deux instances, **deux pairs de la même session ne s'apparient JAMAIS**
    # — chacun attend l'autre, et rien ne le dit. C'est une panne MUETTE, et
    # aucun équilibrage par adresse collante ne la referme : deux pairs de la
    # même session n'ont aucune raison de partager une adresse.
    #
    # ⚠️ CE COMMENTAIRE EST UNE DÉCLARATION, PAS UNE GARDE. Rien n'empêche
    # d'ajouter une ligne ci-dessous. Le remède minimal est nommé et non livré :
    # refuser de démarrer si une seconde instance est détectée, par un verrou
    # consultatif en base (`pg_advisory_lock`).
    upstream plateforme {
        server plateforme:8080;
        keepalive 32;
    }

    # Rediriger le clair vers TLS. La page n'est jamais servie en clair : un
    # client qui la chargerait ainsi ouvrirait ensuite des `ws://`, et le
    # contenu mixte n'est même pas le pire — le jeton passerait en clair.
    server {
        listen 80;
        listen [::]:80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        # 🔴 LA PLATEFORME NE TERMINE JAMAIS TLS (spec §9) : c'est ici, et ici
        # seulement, que le chiffrement s'arrête. Le service écoute en clair sur
        # le réseau interne, à une adresse que seul ce proxy atteint.
        #
        # ⚠️ NGINX REFUSE DE DÉMARRER si l'un de ces deux fichiers ne se lit
        # pas, en le NOMMANT. C'est délibéré, et c'est ce qui remplace le
        # `${VAR:?}` que le fichier de composition ne peut pas employer ici :
        # une rupture immédiate et nommée, plutôt qu'un échec au premier
        # handshake.
        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        root /usr/share/nginx/html;
        index index.html;

        # ⚠️ AUCUN `proxy_set_header` ICI : ils sont tous au niveau `http`, et en
        # ajouter un seul ici les effacerait TOUS. Voir l'encadré là-haut.

        # ── LA PAGE ───────────────────────────────────────────────────────────
        #
        # Depuis le 21 août 2026, la racine ne sert plus que la page : la
        # montée WebSocket du signaling vit sur `/signal`, un `location`
        # ordinaire plus bas, et ne se dispute plus ce chemin avec elle. Ce
        # `location /` n'a donc plus besoin de départager les deux par
        # l'en-tête `Upgrade`.
        location / {
            # ── LES EN-TÊTES DE LA PAGE ──────────────────────────────────────
            #
            # ⚠️ CE BLOC NE VAUT QUE POUR LE DOCUMENT SERVI PAR NGINX. Les
            # réponses de l'API portent les leurs, posés par
            # `plateforme/src/http/entetes.ts` (`nosniff`, `no-store`), et
            # `add_header` d'ici ne s'y applique pas — c'est un partage
            # délibéré : le proxy pose ce qui concerne le NAVIGATEUR, le
            # service pose ce qui concerne la RÉPONSE.
            #
            # 🔴 `connect-src` DOIT NOMMER `wss:`, ET C'EST LA PANNE MUETTE QUE
            # CE FICHIER EXISTE POUR ÉVITER. Sans lui, la page se charge
            # parfaitement, tout paraît normal, et **le média ne s'établit
            # jamais** : le navigateur refuse la montée WebSocket en la
            # journalisant dans une console que personne ne regarde. C'est le
            # critère ⑤ de la recette qui le juge, dans un navigateur réel —
            # aucun test Node ne peut voir une violation de CSP.
            #
            # ⚠️ MESURÉ LE 21 AOÛT 2026, DANS CHROME, ET CELA CHANGE CE QU'IL
            # FAUT CROIRE DE CETTE LIGNE : `'self'` COUVRE DÉJÀ UNE MONTÉE
            # `wss:` DE MÊME ORIGINE. Les trois valeurs `'none'`, `'self'` et
            # `'self' wss: https:` ont été servies tour à tour à un navigateur
            # réel ouvrant `wss://<même origine>/` :
            #
            #     connect-src 'none'              -> WS-REFUSE
            #     connect-src 'self'              -> WS-OUVERT
            #     connect-src 'self' wss: https:  -> WS-OUVERT
            #
            # 🔴 CONSÉQUENCE POUR QUI RELIRA CE FICHIER : **retirer `wss:` ne
            # casse RIEN**, et une recette qui prendrait ce retrait pour sa
            # rouge mesurerait un contrôle qui ne peut pas échouer. La rouge
            # qui discrimine est `connect-src 'none'`, et c'est elle qu'il faut
            # jouer.
            #
            # ⚠️ POURQUOI `wss:` ET `https:` RESTENT MALGRÉ CELA, ET CE QU'ILS
            # COÛTENT. Ils ne servent pas l'origine unique — `'self'` y suffit.
            # Ils servent les deux échappatoires d'essai que le client
            # documente, `?signaling=` et `?plateforme=`, qui visent un AUTRE
            # hôte : sans eux, le navigateur les refuserait. Leur coût est réel
            # et il faut l'écrire — un schéma nu autorise **n'importe quel**
            # hôte `wss:`/`https:`, ce qui est nettement plus large que ce dont
            # ce déploiement a besoin. **Un exploitant qui n'emploie pas ces
            # échappatoires DOIT resserrer cette ligne à `connect-src 'self'`**,
            # et la mesure ci-dessus établit que rien ne s'en trouvera cassé.
            #
            # `blob:` est là pour les URL d'objet du flux média ; `data:` pour
            # les images en ligne du client.
            #
            # 🔴 `manifest-src 'self'` EST EXPLICITE DEPUIS LE 29 AOÛT 2026 —
            # voir `plateforme/src/http/page/entetes-page.ts::CSP`, dont cette
            # ligne est la copie statique éprouvée par
            # `entetes-page.test.ts::la CSP ne dérive pas de celle de nginx`.
            # Chrome nommait lui-même le repli implicite sur `default-src`
            # dans son message de violation ; la cause réelle était un
            # `<link rel="manifest">` sans `crossorigin`, corrigée côté client.
            #
            # 🔴 ELLE PORTE AUSSI `blob:` DEPUIS LE 30 AOÛT 2026 — régression
            # commandée la veille et trouvée EN PRODUCTION par le propriétaire :
            # le manifeste PAR APPLICATION (voie V1 de G5) est publié en
            # `blob:` par `client/src/hub/page.ts::publierLeManifeste`, faute
            # de route authentifiée pour le servir par HTTP ; `'self'` seul le
            # bloquait en boucle. Voir le commentaire complet, avec ce que
            # `blob:` autorise réellement, dans `entetes-page.ts::CSP`.
            add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss: https:; img-src 'self' data: blob:; media-src 'self' blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            # 🔴 `frame-ancestors 'none'` CI-DESSUS REMPLACE `X-Frame-Options`,
            # et il est PLUS FORT : il est respecté par tous les navigateurs
            # modernes et n'a pas les ambiguïtés d'`ALLOW-FROM`. L'ancien
            # en-tête est conservé pour les clients qui ne lisent que lui.
            add_header X-Frame-Options "DENY" always;
            # 🔴 HSTS : une fois la page vue en TLS, le navigateur REFUSE de la
            # recharger en clair, même si l'usager tape `http://`. C'est ce qui
            # ferme la fenêtre que la redirection 301 ci-dessus laisse ouverte
            # au tout premier chargement.
            #
            # ⚠️ `preload` N'EST PAS POSÉ, et c'est délibéré : il engage le
            # domaine ENTIER, sous-domaines compris, auprès des navigateurs, et
            # se défait très lentement. Ce n'est pas une décision qu'un fichier
            # de configuration prend à la place de son exploitant.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;

            # La page, ou 404.
            try_files $uri $uri/ /index.html;
        }

        # Le relais de signaling. Depuis le 21 août 2026 il vit sur `/signal`
        # et non plus sur la racine, ce qui retire à ce fichier la table
        # `map $http_upgrade $vers_plateforme` et le `location` nommé qu'elle
        # servait : la page et la montée ne se disputent plus le même chemin.
        location = /signal {
            proxy_pass http://plateforme;
            # ⚠️ AUCUN `proxy_set_header` : les SEPT du niveau `http`
            # suffisent, et en ajouter un ici les effacerait tous — c'est la
            # même règle que suit `location = /agent` juste en dessous.
            #
            # Une session de signaling reste ouverte sans rien dire pendant les
            # temps morts ; le défaut de 60 s la couperait.
            proxy_read_timeout  1h;
            proxy_send_timeout  1h;
        }

        # ── LE CANAL DES AGENTS ──────────────────────────────────────────────
        #
        # Chemin distinct de la racine, donc pas d'ambiguïté ici : tout ce qui
        # arrive sur `/agent` va au service, montée ou non.
        location = /agent {
            proxy_pass http://plateforme;
            # ⚠️ AUCUN `proxy_set_header` : les SEPT du niveau `http`
            # suffisent, et en ajouter un ici les effacerait tous — c'est
            # exactement la faute que ce fichier a commise puis corrigée.
            #
            # Un agent parle rarement quand la VM est au repos ; le défaut de
            # 60 s couperait le canal entre deux battements de cœur.
            proxy_read_timeout  1h;
            proxy_send_timeout  1h;
        }

        # ── L'API ────────────────────────────────────────────────────────────
        #
        # Les quatre chemins sont ÉNUMÉRÉS plutôt que capturés par un motif
        # large : un `location /api/` n'existe pas ici, et un fourre-tout
        # relaierait au service des chemins qu'il ne connaît pas, en masquant
        # les 404 que la page devrait rendre.
        location /auth/  { proxy_pass http://plateforme; }
        location = /session { proxy_pass http://plateforme; }
        location = /vm      { proxy_pass http://plateforme; }
        # ⚠️ `/sante` EST RELAYÉ, et il ne divulgue rien : `routes-sante.ts` rend
        # un verdict, jamais un détail d'erreur ni une version.
        location = /sante   { proxy_pass http://plateforme; }

        # ── LES ROUTES DU SOUS-PROJET ④, GESTION D'APPLICATIONS ──────────────
        #
        # 🔴 LES DEUX PREMIÈRES SONT CELLES DU SOUS-BLOC **G1**, ET LEUR
        # ABSENCE ÉTAIT UN DÉFAUT SILENCIEUX QUE PERSONNE N'AVAIT INSCRIT.
        # Sans elles, `GET /applications` et `POST /application/:id/lancer`
        # tombaient dans `location /`, dont la dernière ligne est
        # `try_files $uri $uri/ /index.html` : **derrière ce profil, elles
        # rendaient LA PAGE, en 200, au lieu du JSON.** C'est pire qu'un 404 —
        # un `fetch` du hub y lisait du HTML et échouait à l'analyse, sur un
        # service parfaitement sain. Relevé par le sous-bloc G3 en écrivant les
        # siennes, et corrigé ici plutôt que légué : un hub qui téléverse sans
        # pouvoir lister n'a aucun sens.
        #
        # ⚠️ **RIEN DE CE BLOC N'A ÉTÉ ÉPROUVÉ PAR UN NGINX**, et il faut le
        # dire : aucune tâche de G3 ne monte le profil de déploiement. Un
        # `nginx -t` vert ne prouverait d'ailleurs rien du ROUTAGE — ce fichier
        # a lui-même porté, avant le 21 août 2026, une configuration déclarée
        # « ok » qui rendait la page à un client WebSocket (voir l'historique
        # git de ce fichier ; le montage qui le prouvait a disparu avec la
        # table `map $vers_plateforme` que la tâche 6 a retirée).
        location = /applications { proxy_pass http://plateforme; }
        location ~ ^/application/[^/]+/lancer$ { proxy_pass http://plateforme; }
        location ~ ^/application/[^/]+/icone$  { proxy_pass http://plateforme; }
        location ~ ^/icone/[^/]+$              { proxy_pass http://plateforme; }

        # ── LE TÉLÉVERSEMENT D'INSTALLEURS (sous-bloc G3) ────────────────────
        #
        # 🔴 `client_max_body_size` EST POSÉ EXPLICITEMENT, ET NON LAISSÉ AU
        # DÉFAUT. Le défaut de nginx est **1 m** d'après sa documentation
        # — ⚠️ **NON MESURÉ ICI** —, ce qui refuserait une tranche de 8 Mio
        # **avant** qu'elle n'atteigne le service, et **le service n'en saurait
        # rien** : le navigateur verrait un 413 venu d'un intermédiaire, sans
        # motif typé. Compter sur un défaut qu'on n'a pas mesuré serait
        # exactement ce que ce fichier reproche à ses propres angles morts.
        #
        # La valeur vaut `TAILLE_TRANCHE` (8 Mio) plus une marge : le corps est
        # la tranche BRUTE, sans enveloppe, mais un intermédiaire peut ajouter.
        location = /televersement {
            proxy_pass http://plateforme;
            client_max_body_size 1m;
        }
        location ~ ^/televersement/[^/]+$ { proxy_pass http://plateforme; }
        location ~ ^/televersement/[^/]+/sceller$ {
            proxy_pass http://plateforme;
            # Le scellement relit toutes les tranches à travers un SHA-256 :
            # plusieurs centaines de mégaoctets, bien au-delà du défaut de 60 s.
            proxy_read_timeout 30m;
        }
        location ~ ^/televersement/[^/]+/tranche/[0-9]+$ {
            proxy_pass http://plateforme;
            client_max_body_size 12m;
            # 🔴 SANS `proxy_request_buffering off`, NGINX TAMPONNE LE CORPS
            # SUR SON PROPRE DISQUE avant de relayer. Sur un téléversement de
            # 800 Mo découpé en tranches, cela recopie tout le fichier une
            # seconde fois, sur un volume que personne n'a dimensionné pour
            # cela. ⚠️ **LECTURE DE LA DOCUMENTATION NGINX, NON MESURÉE ICI.**
            proxy_request_buffering off;
            proxy_read_timeout 10m;
        }

        # ── LES DEUX ROUTES DE L'INSTALLATION ────────────────────────────────
        location = /installation { proxy_pass http://plateforme; }
        location ~ ^/installation/[^/]+$ { proxy_pass http://plateforme; }
        # 🔴 C'EST L'AGENT QUI APPELLE CELLE-CI, et il tire plusieurs centaines
        # de mégaoctets. `proxy_buffering off` évite que nginx ne recopie la
        # réponse entière avant de la relayer ; le `proxy_read_timeout` allongé
        # évite qu'il ne coupe un transfert plus long que 60 s.
        # ⚠️ **LECTURE DE LA DOCUMENTATION, NON MESURÉE ICI.**
        location ~ ^/televersement/[^/]+/contenu$ {
            proxy_pass http://plateforme;
            proxy_buffering off;
            proxy_read_timeout 30m;
        }
    }
}
