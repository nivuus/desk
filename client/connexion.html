<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Connexion</title>
        <!-- L'ORDRE PORTE LA CASCADE : socle (tokens + base), primitives, puis
             la feuille de cette surface. Trois `<link>` et aucun `@import` :
             c'est ce qui laisse Vite PARTAGER `primitives.css` avec la
             page-shell au lieu de la ré-inliner dans chacune. -->
        <link rel="stylesheet" href="/src/design/socle.css" />
        <link rel="stylesheet" href="/src/design/primitives.css" />
        <link rel="stylesheet" href="/src/connexion.css" />
    </head>
    <body>
        <main class="connexion">
            <div class="carte connexion__carte">
                <h1 class="connexion__titre">Connexion</h1>
                <form id="connexion" class="connexion__formulaire">
                    <p class="champ">
                        <label class="champ__etiquette" for="email">Courriel</label>
                        <input
                            class="champ__saisie"
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="username"
                            required
                        />
                    </p>
                    <p class="champ">
                        <label class="champ__etiquette" for="motdepasse">Mot de passe</label>
                        <input
                            class="champ__saisie"
                            id="motdepasse"
                            name="motdepasse"
                            type="password"
                            autocomplete="current-password"
                            required
                        />
                    </p>
                    <p>
                        <button id="valider" type="submit" class="bouton bouton--principal">
                            Se connecter
                        </button>
                    </p>
                </form>
                <div id="message" class="message connexion__message" role="status"></div>

                <!-- LE SÉLECTEUR DE THÈME, ici par EXTENSION RAISONNÉE de la
                     spec §5.2 : cet écran est souvent la première surface, et
                     parfois la seule, qu'un utilisateur non authentifié voie.
                     Un défaut sombre qu'on ne pourrait pas changer avant de
                     s'être connecté est ce que le §11 range sous « réversible
                     en un clic dès S3 ». Coût : zéro — même module. -->
                <p
                    id="themes"
                    class="connexion__theme connexion__actions"
                    role="group"
                    aria-label="Thème"
                ></p>
            </div>
        </main>
        <script type="module" src="/src/connexion.ts"></script>
    </body>
</html>
