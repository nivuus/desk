<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Sign in</title>
        <!-- THE ORDER CARRIES THE CASCADE: base layer (tokens + base), primitives,
             then this surface's sheet. Three `<link>` and no `@import`:
             that is what lets Vite SHARE `primitives.css` with the
             shell page instead of re-inlining it into each one. -->
        <link rel="stylesheet" href="/src/design/socle.css" />
        <link rel="stylesheet" href="/src/design/primitives.css" />
        <link rel="stylesheet" href="/src/connexion.css" />
    </head>
    <body>
        <main class="connexion">
            <div class="carte connexion__carte">
                <h1 class="connexion__titre">Sign in</h1>
                <form id="connexion" class="connexion__formulaire">
                    <p class="champ">
                        <label class="champ__etiquette" for="email">Email</label>
                        <input
                            class="champ__saisie"
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="username"
                            required
                        />
                    </p>
                    <p class="champ">
                        <label class="champ__etiquette" for="motdepasse">Password</label>
                        <input
                            class="champ__saisie"
                            id="motdepasse"
                            name="motdepasse"
                            type="password"
                            autocomplete="current-password"
                            required
                        />
                    </p>
                    <p>
                        <button id="valider" type="submit" class="bouton bouton--principal">
                            Sign in
                        </button>
                    </p>
                </form>
                <div id="message" class="message connexion__message" role="status"></div>

                <!-- THE THEME SELECTOR, here as a REASONED EXTENSION of
                     spec §5.2: this screen is often the first surface, and
                     sometimes the only one, an unauthenticated user sees.
                     A dark default that could not be changed before
                     signing in is what §11 files under "reversible
                     in one click from S3". Cost: zero — same module. -->
                <p
                    id="themes"
                    class="connexion__theme connexion__actions"
                    role="group"
                    aria-label="Theme"
                ></p>
            </div>
        </main>
        <script type="module" src="/src/connexion.ts"></script>
    </body>
</html>
