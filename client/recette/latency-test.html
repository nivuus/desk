<!doctype html>
<html>
<head><title>latency-test</title></head>
<body style="margin:0;padding:0;height:100vh;width:100vw;background:#000000;overflow:hidden">
<script>
  // Toggles the whole page background between black and white on each press of the
  // space bar. Serves as a sharp visual pattern to time, within a single
  // clock domain (the client browser's), the delay between sending
  // a key and its visible effect in the decoded video stream.
  var state = false;
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space') {
      state = !state;
      document.body.style.background = state ? '#ffffff' : '#000000';
    }
  });
</script>
</body>
</html>
