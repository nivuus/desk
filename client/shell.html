<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bureau</title>
    <!-- L'ORDRE PORTE LA CASCADE : le socle (tokens + base), puis les
         primitives, puis la feuille de cette surface. Trois `<link>` et aucun
         `@import` : c'est ce qui laisse Vite PARTAGER `primitives.css` entre
         les pages qui la lient, au lieu de la ré-inliner dans chacune. -->
    <link rel="stylesheet" href="/src/design/socle.css" />
    <link rel="stylesheet" href="/src/design/primitives.css" />
    <link rel="stylesheet" href="/src/shell.css" />
  </head>
  <body>
    <main class="bureau">
      <h1 class="bureau__titre">Bureau</h1>
      <div id="statut" class="message bureau__bandeau" role="status"></div>

      <section class="bureau__section">
        <h2 class="bureau__section-titre">Mes fichiers</h2>
        <!--
          Le lecteur « Mes Fichiers ». Le bouton vit ICI et nulle part ailleurs :
          la page-shell détient le répertoire, et elle seule (spec §3.3). Elle est
          déjà la page unique par utilisateur, elle est le seul endroit où le geste
          a un sens, et surtout AUCUNE FENÊTRE D'APPLICATION N'EST SPÉCIALE — c'est
          l'invariant que la page-shell existe pour tenir.

          ⚠️ HABILLER N'EST PAS DÉPLACER : le sous-bloc S3 a donné à ce bouton sa
          classe de primitive et l'a rangé dans une section, il ne l'a pas bougé
          d'une page. L'invariant ci-dessus est exactement celui d'avant.
        -->
        <div class="bureau__actions">
          <button id="choisir-dossier" type="button" class="bouton bouton--secondaire">
            Choisir mon dossier
          </button>
        </div>
        <div id="etat-fichiers" class="message bureau__bandeau" role="status"></div>
        <!--
          🔴 LE COMPTEUR D'ÉCRITURES DUES EST UN NOMBRE DANS UN ATTRIBUT, PAS UNE
          PHRASE. Le pilote de recette lit `data-dues`, jamais le texte.

          ⚠️ C'est le remède direct au piège que F1 a payé NEUF MINUTES :
          « Lecteur … monté » et « n'a pas pu être monté » partagent une
          sous-chaîne, le pilote testait `includes('mont')`, et une mesure
          entière a tourné sur un pont NON monté. Le produit garde cette
          ambiguïté sur ce bandeau-là ; F2 ne la rejoue pas sur le compteur.

          ⚠️ ET `data-vues` EST CUMULATIF, JAMAIS REMIS À ZÉRO. `data-dues="0"`
          SEUL ne dit rien : c'est aussi ce que rend une machine où rien n'a eu
          lieu. `dues=0` ET `vues>0` est un succès ; `dues=0` ET `vues=0` est une
          MESURE NON PRISE.
        -->
        <div
          id="ecritures-dues"
          class="message bureau__bandeau"
          role="status"
          data-dues="0"
          data-vues="0"
        ></div>
        <!--
          F5 — LES DEUX BOUTONS DE LA VIE LONGUE.

          `#rafraichir` vide le cache d'énumération du pont ET le cache négatif
          de ProjFS : c'est le SEUL moyen de faire apparaître un fichier ajouté
          sur le poste local, et c'est pourquoi il est toujours là.

          `#reprendre-enregistrement` est CACHÉ par défaut et n'apparaît QUE si
          le pont annonce `retenues` — un bouton toujours présent qui ne fait
          rien la plupart du temps est un piège à clic. Son `data-retenues` est
          ce que le pilote de recette lit, JAMAIS le texte : piège de F1, payé
          neuf minutes sur deux messages qui partageaient une sous-chaîne.
        -->
        <p class="bureau__actions" data-retenues="false" id="actions-fichiers">
          <button id="rafraichir" type="button" class="bouton bouton--discret">
            Rafraîchir
          </button>
          <button
            id="reprendre-enregistrement"
            type="button"
            class="bouton bouton--secondaire"
            hidden
          >
            Reprendre l’enregistrement
          </button>
        </p>
      </section>

      <section class="bureau__section">
        <h2 class="bureau__section-titre">Mes fenêtres</h2>
        <ul id="fenetres" class="bureau__fenetres"></ul>
      </section>

      <!-- LE SÉLECTEUR DE THÈME. La spec §5.2 le prescrit nommément pour cette
           page ; `selecteur-theme.ts` y pose ses trois boutons. Le `role` et le
           libellé du groupe vivent ICI, dans le balisage : les primitives sont
           du CSS et ne portent aucun rôle ARIA. -->
      <section class="bureau__section">
        <h2 class="bureau__section-titre" id="titre-theme">Thème</h2>
        <p id="themes" class="bureau__actions" role="group" aria-labelledby="titre-theme"></p>
      </section>
    </main>

    <!--
      LE BALISAGE D'UNE CARTE VIT ICI, PAS DANS LE TYPESCRIPT. `shell-page.ts`
      clone ce modèle et le remplit ; il ne construit plus d'éléments à la main.

      Trois raisons, dont la première décide :
        ① toutes les classes restent dans le HTML, donc dans le périmètre le
           plus simple du contrôle §7.9 — celui qui ne dépend d'aucune analyse
           de TypeScript ;
        ② le balisage d'une carte se lit à l'endroit où l'on regarde une page ;
        ③ `shell-page.ts` reste ce que son en-tête dit qu'il est — « aucune
           règle ici ».

      ⚠️ LES CROCHETS SONT DES ATTRIBUTS `data-*`, PAS DES CLASSES. Une classe
      sert à peindre ; s'en servir aussi comme point d'accroche du script
      rendrait tout renommage visuel capable de casser le câblage en silence.
    -->
    <template id="modele-fenetre">
      <li class="bureau__fenetre">
        <article class="carte bureau__carte">
          <h3 class="carte__titre" data-titre></h3>
          <p class="carte__corps">
            <span class="bureau__pastille" data-etat></span>
          </p>
          <div class="bureau__actions">
            <button type="button" class="bouton bouton--discret" data-rouvrir>Rouvrir</button>
          </div>
        </article>
      </li>
    </template>

    <script type="module" src="/src/shell-page.ts"></script>
  </body>
</html>
