<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Applications</title>
        <!-- L'ORDRE PORTE LA CASCADE : socle (tokens + base), primitives, puis
             la feuille de cette surface. Trois `<link>` et aucun `@import` :
             c'est ce qui laisse Vite PARTAGER `primitives.css` avec les trois
             autres surfaces au lieu de le ré-inliner dans chacune. -->
        <link rel="stylesheet" href="/src/design/socle.css" />
        <link rel="stylesheet" href="/src/design/primitives.css" />
        <link rel="stylesheet" href="/src/hub/hub.css" />
        <!-- ⚠️ APRÈS `hub.css`, ET L'ORDRE PORTE LA CASCADE. Cette feuille
             vient de `shell.html` avec les sections ci-dessous ; elle sera
             renommée `bureau/bureau.css` quand la page-shell disparaîtra
             (tâche 9), le nom `shell` mentant dès lors sur ce qu'elle peint. -->
        <link rel="stylesheet" href="/src/shell.css" />
        <!-- ⚠️ AUCUN `<link rel="manifest">` ICI, ET C'EST LE FOND DE G5.
             Le manifeste du HUB est engendré AU BUILD depuis `tokens.ts` et
             posé par le greffon `guac-manifeste-hub` de `vite.config.ts` : une
             couleur écrite en dur dans un `.webmanifest` échapperait à §7.2,
             dont le périmètre est `client/src/**` en `.css`/`.ts` plus les
             entrées Vite, et le dépôt aurait DEUX sources de vérité pour une
             couleur (décision D4 du plan).
             Le manifeste PAR APPLICATION, lui, ne peut pas être servi du tout :
             un `<link rel="manifest">` est allé chercher par le navigateur SANS
             en-tête `Authorization`, et ⑤ ne pose AUCUN cookie. `page.ts` le
             construit donc en mémoire et le publie en `blob:` quand `?app=` est
             présent — voie V1, REÇUE par la porte P0. -->
    </head>
    <body>
        <main class="hub">
            <header class="hub__entete">
                <h1 class="hub__titre">Applications</h1>
                <p class="hub__actions">
                    <!-- 🔴 LE CHEMIN VERS LE BUREAU, ET IL EST VISIBLE.
                         Avant le 30 août 2026, AUCUN lien de navigation ne
                         menait du hub à `shell.html` — la seule page qui
                         traite `fenetre-ouverte`. Le hub étant servi à la
                         racine depuis le lot 14, l'utilisateur n'atteignait
                         donc plus jamais son bureau : il lançait une
                         application et ne voyait rien.

                         ⚠️ UN VRAI `<a>`, PAS UN BOUTON QUI APPELLE
                         `window.open` : une navigation partie d'un clic sur
                         un lien n'est bloquée par aucun navigateur, là où
                         une pop-up ouverte par script l'est hors geste.
                         `href` et `target` sont posés par `hub/page.ts`
                         depuis `hub/bureau.ts` : la page du bureau et le nom
                         de sa fenêtre n'ont qu'UNE source de vérité. -->
                    <a id="bureau" class="bouton bouton--secondaire">Mon bureau</a>
                </p>
                <p id="themes" class="hub__actions" role="group" aria-label="Thème"></p>
            </header>

            <!-- LA ZONE DE DÉPÔT. Le chemin NOMINAL, et il doit fonctionner
                 SEUL : c'est l'amendement du 28/07/2026, que le critère ② de
                 G5 existe pour garder. Le bouton est là parce qu'un dépôt
                 n'est pas accessible au clavier. -->
            <section
                id="depot"
                class="hub__depot"
                aria-labelledby="depot-titre"
                aria-describedby="depot-aide"
            >
                <h2 id="depot-titre" class="hub__depot-titre">Installer un logiciel</h2>
                <p id="depot-aide" class="hub__depot-aide">
                    Déposez ici un fichier .msi, .exe ou .bat — ou choisissez-le.
                </p>
                <p>
                    <button id="choisir" type="button" class="bouton bouton--secondaire">
                        Choisir un fichier…
                    </button>
                </p>
            </section>

            <div id="message" class="message hub__message" role="status"></div>

            <ul id="applications" class="hub__grille"></ul>

            <!-- ═══ CE QUI VIENT DE `shell.html`, LE 31 AOÛT 2026 ═══════════
                 La page-shell est devenue une redirection : le hub est
                 désormais la SEULE surface. Ces deux sections viennent d'elle
                 telles quelles — mêmes identifiants, mêmes crochets `data-*`,
                 même `<template>` — pour que `shell.ts`, qui est pur et testé,
                 soit RÉUTILISÉ et non réécrit.

                 🔴 LES CROCHETS D'INSTRUMENT SURVIVENT AU DÉPLACEMENT :
                 `data-dues`, `data-vues` et `data-retenues` sont lus par les
                 pilotes de recette, et JAMAIS le texte — piège de F1, payé
                 neuf minutes sur deux messages qui partageaient une
                 sous-chaîne. -->

            <div id="statut" class="message hub__message" role="status"></div>

            <!-- ⚠️ `hidden` PAR DÉFAUT, ET RETIRÉ PAR LE SCRIPT DÈS QU'IL Y A
                 UNE FENÊTRE. Une section montrant en permanence « aucune
                 fenêtre ouverte » serait du bruit sur l'état NOMINAL d'un hub
                 qu'on vient d'ouvrir (décision du propriétaire, spec §4.1). -->
            <section id="section-fenetres" class="hub__section" hidden>
                <h2 class="hub__section-titre">Mes fenêtres</h2>
                <ul id="fenetres" class="bureau__fenetres"></ul>
            </section>

            <!-- ⚠️ REPLIÉE, JAMAIS RETIRÉE : « Choisir mon dossier » doit
                 rester atteignable en un geste. `<details>` porte le pli
                 nativement — un élément replié reste dans le DOM, donc reste
                 lisible par un pilote de recette ; un élément RETIRÉ ne l'est
                 pas, et c'est pourquoi c'est un pli et non un rendu
                 conditionnel. Le script l'ouvre (`open = true`) dès qu'un pont
                 est monté, pour que le compteur d'écritures dues et le bouton
                 « Reprendre » ne soient jamais cachés au moment où ils
                 comptent. -->
            <details id="section-fichiers" class="hub__section">
                <summary class="hub__section-titre">Mes fichiers</summary>
                <div class="bureau__actions">
                    <button id="choisir-dossier" type="button" class="bouton bouton--secondaire">
                        Choisir mon dossier
                    </button>
                </div>
                <div id="etat-fichiers" class="message bureau__bandeau" role="status"></div>
                <div
                    id="ecritures-dues"
                    class="message bureau__bandeau"
                    role="status"
                    data-dues="0"
                    data-vues="0"
                ></div>
                <p class="bureau__actions" data-retenues="false" id="actions-fichiers">
                    <button id="rafraichir" type="button" class="bouton bouton--discret">
                        Rafraîchir
                    </button>
                    <button
                        id="reprendre-enregistrement"
                        type="button"
                        class="bouton bouton--secondaire"
                        hidden
                    >
                        Reprendre l’enregistrement
                    </button>
                </p>
            </details>
        </main>

        <!--
          LE BALISAGE D'UNE CARTE D'APPLICATION VIT ICI, PAS DANS LE TYPESCRIPT.
          `hub/cartes.ts` clone ce modèle et le remplit.

          Deux raisons, la première décide : ① toutes les classes restent dans
          le HTML, donc dans le périmètre le plus simple du contrôle §7.9 —
          celui qui ne dépend d'aucune analyse de TypeScript ; ② le balisage
          d'une carte se lit à l'endroit où l'on regarde une page. C'est
          exactement la convention que `shell.html` applique déjà à
          `#modele-fenetre`.

          🔴 `hub__icone--absente` EST DÉCLARÉE ICI, SUR UN ÉLÉMENT QUI NE LA
          PORTE PAS : le script l'AJOUTE quand l'application n'a pas d'icône,
          par `classList.add` d'un LITTÉRAL. Avant cette extraction elle vivait
          dans un ternaire (`className = application.icone === null ? … : …`),
          donc dans une valeur CALCULÉE — invisible au contrôle §7.9, qui ne
          voit que les littéraux. L'extraction est l'occasion de ne pas
          reconduire ce trou (ruling R3).

          ⚠️ LES CROCHETS SONT DES ATTRIBUTS `data-*`, PAS DES CLASSES. Une
          classe sert à peindre ; s'en servir aussi comme point d'accroche du
          script rendrait tout renommage visuel capable de casser le câblage
          en silence.
        -->
        <template id="modele-application">
            <li class="carte hub__entree">
                <img class="hub__icone" data-icone alt="" />
                <div class="hub__corps">
                    <h2 class="hub__nom" data-nom></h2>
                    <p class="hub__boutons">
                        <button type="button" class="bouton bouton--principal" data-lancer>
                            Lancer
                        </button>
                        <button type="button" class="bouton bouton--discret" data-installer>
                            Installer
                        </button>
                    </p>
                </div>
            </li>
        </template>

        <!--
          LE BALISAGE D'UNE CARTE VIT ICI, PAS DANS LE TYPESCRIPT. `shell-page.ts`
          clone ce modèle et le remplit ; il ne construit plus d'éléments à la main.

          Trois raisons, dont la première décide :
            ① toutes les classes restent dans le HTML, donc dans le périmètre le
               plus simple du contrôle §7.9 — celui qui ne dépend d'aucune analyse
               de TypeScript ;
            ② le balisage d'une carte se lit à l'endroit où l'on regarde une page ;
            ③ `shell-page.ts` reste ce que son en-tête dit qu'il est — « aucune
               règle ici ».

          ⚠️ LES CROCHETS SONT DES ATTRIBUTS `data-*`, PAS DES CLASSES. Une classe
          sert à peindre ; s'en servir aussi comme point d'accroche du script
          rendrait tout renommage visuel capable de casser le câblage en silence.
        -->
        <template id="modele-fenetre">
          <li class="bureau__fenetre">
            <article class="carte bureau__carte">
              <h3 class="carte__titre" data-titre></h3>
              <p class="carte__corps">
                <span class="bureau__pastille" data-etat></span>
              </p>
              <div class="bureau__actions">
                <button type="button" class="bouton bouton--discret" data-rouvrir>Rouvrir</button>
              </div>
            </article>
          </li>
        </template>
        <script type="module" src="/src/hub/page.ts"></script>
    </body>
</html>
