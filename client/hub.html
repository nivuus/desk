<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Applications</title>
        <!-- THE ORDER CARRIES THE CASCADE: base layer (tokens + base), primitives,
             then this surface's sheet. Three `<link>` and no `@import`:
             that is what lets Vite SHARE `primitives.css` with the three
             other surfaces instead of re-inlining it into each one. -->
        <link rel="stylesheet" href="/src/design/socle.css" />
        <link rel="stylesheet" href="/src/design/primitives.css" />
        <link rel="stylesheet" href="/src/hub/hub.css" />
        <!-- ⚠️ AFTER `hub.css`, AND THE ORDER CARRIES THE CASCADE. This sheet
             comes from `shell.html` with the sections below; RENAMED
             `shell.css` → `bureau/bureau.css` at task 9 (31 August 2026),
             when `shell.html` stopped carrying any markup — the name `shell`
             was from then on lying about what it paints. -->
        <link rel="stylesheet" href="/src/bureau/bureau.css" />
        <!-- ⚠️ NO `<link rel="manifest">` HERE, AND THAT IS THE CORE OF G5.
             The HUB manifest is generated AT BUILD TIME from `tokens.ts` and
             set by the `guac-manifeste-hub` plugin of `vite.config.ts`: a
             colour hardcoded in a `.webmanifest` would escape §7.2,
             whose scope is `client/src/**` as `.css`/`.ts` plus the
             Vite entries, and the repository would have TWO sources of truth for a
             colour (decision D4 of the plan).
             The PER-APPLICATION manifest, for its part, cannot be served at all:
             a `<link rel="manifest">` is fetched by the browser WITHOUT an
             `Authorization` header, and ⑤ sets NO cookie. `page.ts` therefore
             builds it in memory and publishes it as `blob:` when `?app=` is
             present — path V1, ACCEPTED by gate P0. -->
    </head>
    <body>
        <main class="hub">
            <header class="hub__entete">
                <h1 class="hub__titre">Applications</h1>
                <p id="themes" class="hub__actions" role="group" aria-label="Theme"></p>
            </header>

            <!-- THE DROP ZONE. The NOMINAL path, and it must work
                 ALONE: that is the amendment of 28/07/2026, which criterion ② of
                 G5 exists to keep. The button is there because a drop
                 is not keyboard accessible. -->
            <section
                id="depot"
                class="hub__depot"
                aria-labelledby="depot-titre"
                aria-describedby="depot-aide"
            >
                <h2 id="depot-titre" class="hub__depot-titre">Install software</h2>
                <p id="depot-aide" class="hub__depot-aide">
                    Drop a .msi, .exe or .bat file here — or choose it.
                </p>
                <p>
                    <button id="choisir" type="button" class="bouton bouton--secondaire">
                        Choose a file…
                    </button>
                </p>
            </section>

            <div id="message" class="message hub__message" role="status"></div>

            <ul id="applications" class="hub__grille"></ul>

            <!-- ═══ WHAT COMES FROM `shell.html`, ON 31 AUGUST 2026 ═══════════
                 The shell page has become a redirection: the hub is
                 now the ONLY surface. These two sections come from it
                 as they were — same identifiers, same `data-*` hooks,
                 same `<template>` — so that `shell.ts`, which is pure and tested,
                 is REUSED and not rewritten.

                 🔴 THE INSTRUMENT HOOKS SURVIVE THE MOVE:
                 `data-dues`, `data-vues` and `data-retenues` are read by the
                 acceptance drivers, and NEVER the text — an F1 trap, paid
                 nine minutes on two messages that shared a
                 substring. -->

            <div id="statut" class="message hub__message" role="status"></div>

            <!-- ⚠️ `hidden` BY DEFAULT, AND REMOVED BY THE SCRIPT AS SOON AS THERE IS
                 A WINDOW. A section permanently showing "no open
                 window" would be noise on the NOMINAL state of a hub
                 that was just opened (owner decision, spec §4.1). -->
            <section id="section-fenetres" class="hub__section" hidden>
                <h2 class="hub__section-titre">My windows</h2>
                <ul id="fenetres" class="bureau__fenetres"></ul>
            </section>

            <!-- ⚠️ FOLDED, NEVER REMOVED: "Choose my folder" must
                 stay reachable in one gesture. `<details>` carries the fold
                 natively — a folded element stays in the DOM, so stays
                 readable by an acceptance driver; a REMOVED element is
                 not, and that is why it is a fold and not a conditional
                 render. The script opens it (`open = true`) as soon as a bridge
                 is mounted, so that the due writes counter and the
                 "Resume" button are never hidden at the moment they
                 matter. -->
            <details id="files-section" class="hub__section">
                <summary class="hub__section-titre">My files</summary>
                <div class="bureau__actions">
                    <button id="choisir-dossier" type="button" class="bouton bouton--secondaire">
                        Choose my folder
                    </button>
                </div>
                <div id="files-state" class="message bureau__bandeau" role="status"></div>
                <div
                    id="ecritures-dues"
                    class="message bureau__bandeau"
                    role="status"
                    data-dues="0"
                    data-vues="0"
                ></div>
                <p class="bureau__actions" data-retenues="false" id="files-actions">
                    <button id="rafraichir" type="button" class="bouton bouton--discret">
                        Refresh
                    </button>
                    <button
                        id="reprendre-enregistrement"
                        type="button"
                        class="bouton bouton--secondaire"
                        hidden
                    >
                        Resume saving
                    </button>
                </p>
            </details>
        </main>

        <!--
          THE MARKUP OF AN APPLICATION CARD LIVES HERE, NOT IN THE TYPESCRIPT.
          `hub/cartes.ts` clones this template and fills it.

          Two reasons, the first one decides: ① all the classes stay in
          the HTML, so in the simplest scope of check §7.9 —
          the one that depends on no TypeScript analysis; ② the markup
          of a card is read where one looks at a page. That is
          exactly the convention `#modele-fenetre` already applies further
          down in this same page — coming from `shell.html` (see the block
          "WHAT COMES FROM `shell.html`" above), which no longer carries this
          template since the shell page became a redirection
          (task 9).

          🔴 `hub__icone--absente` IS DECLARED HERE, ON AN ELEMENT THAT DOES NOT
          CARRY IT: the script ADDS it when the application has no icon,
          through `classList.add` of a LITERAL. Before this extraction it lived
          in a ternary (`className = application.icone === null ? … : …`),
          so in a COMPUTED value — invisible to check §7.9, which only
          sees literals. The extraction is the opportunity not to
          carry that hole over (ruling R3).

          ⚠️ THE HOOKS ARE `data-*` ATTRIBUTES, NOT CLASSES. A
          class is for painting; also using it as the script's attachment
          point would make any visual rename able to break the wiring
          silently.
        -->
        <template id="modele-application">
            <li class="carte hub__entree">
                <img class="hub__icone" data-icone alt="" />
                <div class="hub__corps">
                    <h2 class="hub__nom" data-nom></h2>
                    <p class="hub__boutons">
                        <button type="button" class="bouton bouton--principal" data-lancer>
                            Launch
                        </button>
                        <button type="button" class="bouton bouton--discret" data-installer>
                            Install
                        </button>
                    </p>
                </div>
            </li>
        </template>

        <!--
          THE MARKUP OF A CARD LIVES HERE, NOT IN THE TYPESCRIPT.
          `bureau/fenetres-dom.ts::dessinerFenetres` clones this template and
          fills it; it no longer builds elements by hand.

          Three reasons, the first one decides:
            ① all the classes stay in the HTML, so in the simplest
               scope of check §7.9 — the one that depends on no TypeScript
               analysis;
            ② the markup of a card is read where one looks at a page;
            ③ `fenetres-dom.ts` stays what its header says it is — "wiring,
               and nothing else" (the decisions live in `fenetres.ts`,
               pure and tested).

          ⚠️ THE HOOKS ARE `data-*` ATTRIBUTES, NOT CLASSES. A class
          is for painting; also using it as the script's attachment point
          would make any visual rename able to break the wiring silently.
        -->
        <template id="modele-fenetre">
          <li class="bureau__fenetre">
            <article class="carte bureau__carte">
              <h3 class="carte__titre" data-titre></h3>
              <p class="carte__corps">
                <span class="bureau__pastille" data-etat></span>
              </p>
              <div class="bureau__actions">
                <button type="button" class="bouton bouton--discret" data-rouvrir>Reopen</button>
              </div>
            </article>
          </li>
        </template>
        <script type="module" src="/src/hub/page.ts"></script>
    </body>
</html>
