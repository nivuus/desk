<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Remote session</title>
        <!-- The base layer FIRST, this surface's sheet next: the order
             carries the cascade. `style.css` imports nothing on its side, so that
             Vite SHARES the base layer between the pages instead of re-inlining it
             into each one — measured on the prototype, see the header of style.css. -->
        <link rel="stylesheet" href="/src/design/socle.css" />
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <video id="remote" autoplay playsinline muted tabindex="0"></video>
        <!-- Both banners take the `message` family and its FLOATING
             variant (sub-block S4, task 5): `.message` alone would set, in
             light theme, a light and opaque panel above the video —
             which `tokens.css` forbids in one sentence. The variant swaps the
             opaque background for `--voile-flottant`, out of theme.
             ⚠️ `#stats` is born EMPTY, and `.message:empty` makes it DISAPPEAR
             instead of leaving a frame: that is the intended behaviour, written
             in `primitives/message.css` since S3. -->
        <div id="status" class="message message--flottant" role="status">Connecting…</div>
        <div id="stats" class="message message--flottant" role="status"></div>
        <!-- `hidden` by default: the button appears ONLY if the agent announces
             `mic: true` in its `ready` message (spec §10). An agent from before
             work item E does not carry the field, and a button leading
             nowhere is worse than no button. -->
        <button id="micro" type="button" title="Microphone" hidden>🎤</button>
        <!-- `hidden`: the agent still drives fullscreen through the `fullscreen` message. -->
        <button id="fullscreen" type="button" title="Fullscreen" hidden>⛶</button>
        <!-- THE FULL-FRAME SCREEN OF TERMINAL STATES (sub-block S4, task 9).
             `hidden` by default, and the sheet `src/session/etat-terminal.css`
             sets `.ecran[hidden] { display: none }` EXPLICITLY: the cascade
             compares origin before specificity, so `.ecran { display:
             grid }`, an author rule, would win over the user agent's
             `[hidden]` and the screen would be visible from load time.
             ⚠️ THE TITLE IS BORN EMPTY, AND THAT IS INTENDED: `ecran-terminal.ts` writes it
             from the TONE, a static title being wrong in one of the two cases
             ("Session ended" lies on a failure where no session ever
             started). Copying it here would make two labels to keep in sync. -->
        <div id="fin" class="ecran" hidden>
            <div class="carte ecran__carte">
                <h1 class="ecran__titre"></h1>
                <p class="message" id="fin-raison" role="status"></p>
            </div>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
