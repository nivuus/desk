[package]
name = "agent"
edition.workspace = true
version.workspace = true

[dependencies]
proto = { path = "../proto" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
str0m = "0.21"
tokio-tungstenite = "0.24"
futures-util = "0.3"
opus = "0.3.1"
# Codec STUN de str0m, en dépendance DIRECTE plutôt que par le module
# `str0m::ice` qui est `#[doc(hidden)]` — on ne bâtit pas sur une porte que
# l'auteur a explicitement fermée. Version alignée sur celle que Cargo.lock
# verrouille déjà comme dépendance transitive de str0m : aucun doublon dans
# l'arbre. Même précédent que `windows-core` plus bas.
is = "0.10"
# MESSAGE-INTEGRITY des requêtes TURN.
hmac = "0.12"
sha1 = "0.10"
# Clé longue durée : MD5(user:realm:pass), imposé par la RFC 5766. MD5 n'est
# employé ici QUE comme dérivation de clé normative, jamais comme primitive
# de sécurité.
#
# `md-5` (RustCrypto, API `Md5::digest`) et NON le crate `md5` d'Ivan Ukhov
# (API `md5::compute`) : le premier partage le trait `Digest` avec `sha1`
# déclaré juste au-dessus, donc une seule famille d'API dans ce module.
md-5 = "0.10"

[target.'cfg(windows)'.dependencies]
# Dépendance directe requise par la macro `#[windows::core::implement]`
# (tâche 10, sonde process loopback) : elle génère du code qui référence
# `windows_core::...` directement, un chemin non résolu si seul le crate
# `windows` (qui ne fait que RÉ-EXPORTER `windows_core` sous le nom `core`)
# est déclaré en dépendance. Version alignée sur celle que verrouille déjà
# Cargo.lock comme dépendance transitive de `windows`.
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    # `PKEY_Device_FriendlyName` : le nom convivial d'un point de terminaison
    # audio, sur lequel porte la sélection explicite d'`AUDIO_PERIPHERIQUE`
    # (correction « A-bis », `wasapi/rendu.rs`). La clé de propriété vit dans
    # FunctionDiscovery, pas dans `Win32_Media_Audio`.
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    # `DwmGetWindowAttribute` / `DWMWA_CLOAKED` du hook de détection des
    # fenêtres (`superviseur::hook`) : sans ce filtre, les fenêtres UWP
    # fantômes (masquées par DWM sans jamais s'afficher) seraient annoncées.
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    # Sous-bloc G2 : l'encodage PNG des icones passe par WIC, et JAMAIS par une
    # conversion qui perd le canal alpha. `IWICImagingFactory`,
    # `CreateBitmapFromHBITMAP`, `WICBitmapUseAlpha` et `GUID_ContainerFormatPng`
    # vivent tous ici, derriere cette fonctionnalite
    # (`Win32/Graphics/mod.rs`, le `#[cfg(feature = "Win32_Graphics_Imaging")]`).
    # Aucune dependance nouvelle : c'est une fonctionnalite d'un crate deja
    # present, comme `Win32_System_Environment` pour G1 et
    # `Win32_System_DataExchange` pour le presse-papier.
    #
    # HYPOTHESE A LA REDACTION, CONFIRMEE PAR LA COMPILATION : le plan G2
    # (divergence E11) annoncait celle-ci seule, et rappelait que G1 avait paye
    # exactement cette affirmation — `Win32_UI_Shell` annoncee seule pour
    # `ShellExecuteExW`, refutee par `cargo check --target x86_64-pc-windows-gnu`.
    # Ici la compilation croisee a confirme : elle suffit.
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    # `CreateFileW` est gardée derrière `Win32_Security` dans windows-rs 0.62 :
    # sa signature mentionne `SECURITY_ATTRIBUTES`, même quand on lui passe
    # `None`. Sans cette fonctionnalité, l'import ne résout pas.
    "Win32_Security",
    "Win32_Storage_FileSystem",
    # Les TYPES de ProjFS (`PRJ_CALLBACKS`, `PRJ_CALLBACK_DATA`, les huit
    # `PRJ_*_CB`, les constantes de notification…), et EUX SEULS. Les
    # enveloppes `Prj*` de ce module passent par `windows_core::link!`, qui se
    # développe en `#[link(kind = "raw-dylib")]` (`windows-link-0.2.1/src/lib.rs:22`
    # pour x86_64) : les appeler poserait un import STATIQUE de
    # `ProjectedFSLib.dll` dans le PE. Or `agent.exe` est un seul binaire pour
    # tous les modes (`main.rs`) — un import non résolu ne tuerait pas « le
    # pont », il tuerait la capture, la vidéo et l'entrée sur toute VM dépourvue
    # de ProjFS. D'où la décision D1 : les treize entrées sont résolues à
    # l'EXÉCUTION (`pont/projfs/chargement.rs`), et RIEN du crate ne doit
    # appeler une enveloppe `Prj*`. Le contrôle est un `objdump` sur le binaire
    # bâti — voir l'en-tête de `chargement.rs`.
    "Win32_Storage_ProjectedFileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    # `GetClipboardSequenceNumber`, `OpenClipboard`, `GetClipboardData` et leurs
    # voisines vivent ici ; `GlobalLock` / `GlobalAlloc` dans `Win32_System_Memory`
    # juste en dessous. C'est la SEULE addition de P1 (presse-papier) à ce
    # fichier, et ce sont deux fonctionnalités d'un crate DÉJÀ présent :
    # **P1 n'ajoute aucune dépendance**, ni Rust ni TypeScript.
    "Win32_System_DataExchange",
    # Filtre d'exception de `diagnostics::exceptions` : `EXCEPTION_POINTERS` et
    # `CONTEXT` vivent dans `Diagnostics_Debug` mais sont gardés derrière
    # `System_Kernel` (ils y référencent `FLOATING_SAVE_AREA`) — les deux
    # fonctionnalités sont nécessaires, pas l'une ou l'autre. `ToolHelp` sert
    # à photographier la table des modules à l'installation, pour situer les
    # adresses de retour en `module+décalage` sans allouer au moment de la faute.
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    # `ExpandEnvironmentStringsW` : les raccourcis d'installeurs stockent
    # `%ProgramFiles%\…` et `SLGP_RAWPATH` les rend tels quels, sans les
    # développer. Sans ce développement, la règle « le fichier cible existe »
    # les écarterait tous. C'est la SEULE addition de G1 à ce fichier, et
    # c'est une fonctionnalité d'un crate déjà présent — aucune dépendance
    # nouvelle, ni ici ni ailleurs.
    "Win32_System_Environment",
    "Win32_System_Kernel",
    "Win32_System_IO",
    # `GlobalLock` / `GlobalUnlock` / `GlobalAlloc` : le presse-papier Windows
    # rend un `HGLOBAL`, jamais un pointeur — voir `Win32_System_DataExchange`.
    "Win32_System_Memory",
    # Job Object des enfants du superviseur : `KILL_ON_JOB_CLOSE` fait mourir
    # les N processus agent avec le superviseur, y compris si celui-ci est tué
    # net — aucun code en espace utilisateur ne couvre ce cas.
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    # Tube nommé du capteur (`capteur::serveur`) : `CreateNamedPipeW` et
    # `ConnectNamedPipe` vivent ici, distinct de `Win32_System_IO` qui ne
    # porte que `OVERLAPPED`.
    # `ShellExecuteExW` est gardee derriere `Win32_System_Registry` dans
    # windows-rs 0.62 : `SHELLEXECUTEINFOW` porte un champ `hkeyClass: HKEY`,
    # donc la STRUCTURE ENTIERE et la fonction qui la prend le sont aussi
    # (`Win32/UI/Shell/mod.rs`, le `#[cfg(feature = "Win32_System_Registry")]`
    # pose juste au-dessus de la fonction). RELU DANS LES BINDINGS, pas
    # suppose : le plan G1 (divergence E10) annoncait `Win32_UI_Shell` seule,
    # et la compilation l'a refute — `unresolved imports`. Aucune dependance
    # nouvelle pour autant : c'est la SECONDE fonctionnalite d'un crate deja
    # present, et G1 n'en ajoute pas d'autre.
    "Win32_System_Registry",
    "Win32_System_Pipes",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    # `IMMDevice::OpenPropertyStore` rend un `IPropertyStore`, qui vit ici :
    # sans cette fonctionnalité la méthode elle-même n'existe pas sur
    # `IMMDevice` (windows-rs la remplace par un `usize` dans la vtable).
    # Nécessaire à la lecture du nom convivial (`wasapi/rendu.rs`).
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
] }
# Pilote de manette virtuelle. Crate Rust pur : il parle au pilote noyau
# ViGEmBus par IOCTL, sans SDK C à embarquer. La fonctionnalité
# "unstable_xtarget_notification" est nécessaire pour recevoir les rappels
# de vibration — sans elle, `request_notification` n'existe même pas sur
# `Xbox360Wired` (vérifié sur le code source publié, docs.rs 0.1.4).
vigem-client = { version = "0.1", features = ["unstable_xtarget_notification"] }
