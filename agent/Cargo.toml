[package]
name = "agent"
edition.workspace = true
version.workspace = true

[dependencies]
proto = { path = "../proto" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
str0m = "0.21"
tokio-tungstenite = "0.24"
futures-util = "0.3"
opus = "0.3.1"

[target.'cfg(windows)'.dependencies]
# Dépendance directe requise par la macro `#[windows::core::implement]`
# (tâche 10, sonde process loopback) : elle génère du code qui référence
# `windows_core::...` directement, un chemin non résolu si seul le crate
# `windows` (qui ne fait que RÉ-EXPORTER `windows_core` sous le nom `core`)
# est déclaré en dépendance. Version alignée sur celle que verrouille déjà
# Cargo.lock comme dépendance transitive de `windows`.
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
