[package]
name = "agent"
edition.workspace = true
version.workspace = true

[dependencies]
proto = { path = "../proto" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
str0m = "0.21"
tokio-tungstenite = "0.24"
futures-util = "0.3"
opus = "0.3.1"
# str0m's STUN codec, as a DIRECT dependency rather than through the
# `str0m::ice` module, which is `#[doc(hidden)]` — we do not build on a door
# the author explicitly closed. Version aligned on the one Cargo.lock
# already locks as a transitive dependency of str0m: no duplicate in
# the tree. Same precedent as `windows-core` below.
is = "0.10"
# MESSAGE-INTEGRITY of the TURN requests.
hmac = "0.12"
sha1 = "0.10"
# Long-term key: MD5(user:realm:pass), imposed by RFC 5766. MD5 is
# used here ONLY as a normative key derivation, never as a security
# primitive.
#
# `md-5` (RustCrypto, API `Md5::digest`) and NOT Ivan Ukhov's `md5` crate
# (API `md5::compute`): the former shares the `Digest` trait with `sha1`
# declared just above, hence a single API family in this module.
md-5 = "0.10"

[target.'cfg(windows)'.dependencies]
# Direct dependency required by the `#[windows::core::implement]` macro
# (task 10, process loopback probe): it generates code that references
# `windows_core::...` directly, a path left unresolved if only the `windows`
# crate (which only RE-EXPORTS `windows_core` under the name `core`)
# is declared as a dependency. Version aligned on the one Cargo.lock
# already locks as a transitive dependency of `windows`.
windows-core = "0.100"
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    # `QueryDisplayConfig` / `DisplayConfigGetDeviceInfo`: the only
    # EXPOSED correspondence between the target identifier the virtual display
    # driver returns and the GDI name (`\\.\DISPLAYn`) DXGI enumerates.
    # `placement.rs` asserted the opposite of D1 in batch 32, and this feature
    # is what makes the correction verifiable. See
    # `moniteurs_virtuels/config_affichage.rs`.
    "Win32_Devices_Display",
    # `PKEY_Device_FriendlyName`: the friendly name of an audio endpoint,
    # on which the explicit selection of `AUDIO_PERIPHERIQUE` bears
    # (correction « A-bis », `wasapi/rendu.rs`). The property key lives in
    # FunctionDiscovery, not in `Win32_Media_Audio`.
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    # `DwmGetWindowAttribute` / `DWMWA_CLOAKED` of the window detection hook
    # (`superviseur::hook`): without this filter, ghost UWP windows
    # (cloaked by DWM without ever showing) would be announced.
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    # Sub-block G2: the PNG encoding of icons goes through WIC, and NEVER through a
    # conversion that loses the alpha channel. `IWICImagingFactory`,
    # `CreateBitmapFromHBITMAP`, `WICBitmapUseAlpha` and `GUID_ContainerFormatPng`
    # all live here, behind this feature
    # (`Win32/Graphics/mod.rs`, the `#[cfg(feature = "Win32_Graphics_Imaging")]`).
    # No new dependency: it is a feature of a crate already
    # present, like `Win32_System_Environment` for G1 and
    # `Win32_System_DataExchange` for the clipboard.
    #
    # ASSUMPTION WHEN WRITING, CONFIRMED BY COMPILATION: the G2 plan
    # (divergence E11) announced this one alone, and recalled that G1 had paid for
    # exactly this claim — `Win32_UI_Shell` announced alone for
    # `ShellExecuteExW`, refuted by `cargo check --target x86_64-pc-windows-gnu`.
    # Here the cross-compilation confirmed it: it is enough.
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    # `CreateFileW` is gated behind `Win32_Security` in windows-rs 0.62:
    # its signature mentions `SECURITY_ATTRIBUTES`, even when passed
    # `None`. Without this feature, the import does not resolve.
    "Win32_Security",
    "Win32_Storage_FileSystem",
    # The ProjFS TYPES (`PRJ_CALLBACKS`, `PRJ_CALLBACK_DATA`, the eight
    # `PRJ_*_CB`, the notification constants…), and THEM ALONE. The
    # `Prj*` wrappers of this module go through `windows_core::link!`, which
    # expands to `#[link(kind = "raw-dylib")]` (`windows-link-0.2.1/src/lib.rs:22`
    # for x86_64): calling them would put a STATIC import of
    # `ProjectedFSLib.dll` in the PE. Yet `agent.exe` is a single binary for
    # all modes (`main.rs`) — an unresolved import would not kill « the
    # bridge », it would kill capture, video and input on any VM lacking
    # ProjFS. Hence decision D1: the thirteen entries are resolved at
    # RUN TIME (`pont/projfs/chargement.rs`), and NOTHING in the crate may
    # call a `Prj*` wrapper. The check is an `objdump` of the built
    # binary — see the header of `chargement.rs`.
    "Win32_Storage_ProjectedFileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    # `GetClipboardSequenceNumber`, `OpenClipboard`, `GetClipboardData` and their
    # neighbours live here; `GlobalLock` / `GlobalAlloc` in `Win32_System_Memory`
    # just below. It is the ONLY addition of P1 (clipboard) to this
    # file, and they are two features of a crate ALREADY present:
    # **P1 adds no dependency**, neither Rust nor TypeScript.
    "Win32_System_DataExchange",
    # Exception filter of `diagnostics::exceptions`: `EXCEPTION_POINTERS` and
    # `CONTEXT` live in `Diagnostics_Debug` but are gated behind
    # `System_Kernel` (they reference `FLOATING_SAVE_AREA` there) — both
    # features are needed, not one or the other. `ToolHelp` is used
    # to snapshot the module table at install time, to locate the
    # return addresses as `module+offset` without allocating when the fault hits.
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    # `ExpandEnvironmentStringsW`: installer shortcuts store
    # `%ProgramFiles%\…` and `SLGP_RAWPATH` returns them as is, without
    # expanding them. Without this expansion, the « target file exists » rule
    # would discard them all. It is the ONLY addition of G1 to this file, and
    # it is a feature of a crate already present — no new dependency,
    # neither here nor elsewhere.
    "Win32_System_Environment",
    "Win32_System_Kernel",
    "Win32_System_IO",
    # `GlobalLock` / `GlobalUnlock` / `GlobalAlloc`: the Windows clipboard
    # returns an `HGLOBAL`, never a pointer — see `Win32_System_DataExchange`.
    "Win32_System_Memory",
    # Job Object of the supervisor's children: `KILL_ON_JOB_CLOSE` makes
    # the N agent processes die with the supervisor, including if it is killed
    # outright — no user-space code covers that case.
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    # Named pipe of the sensor (`capteur::serveur`): `CreateNamedPipeW` and
    # `ConnectNamedPipe` live here, distinct from `Win32_System_IO` which only
    # carries `OVERLAPPED`.
    # `ShellExecuteExW` is gated behind `Win32_System_Registry` in
    # windows-rs 0.62: `SHELLEXECUTEINFOW` carries an `hkeyClass: HKEY` field,
    # so the WHOLE STRUCTURE and the function taking it are gated too
    # (`Win32/UI/Shell/mod.rs`, the `#[cfg(feature = "Win32_System_Registry")]`
    # set just above the function). READ IN THE BINDINGS, not
    # assumed: the G1 plan (divergence E10) announced `Win32_UI_Shell` alone,
    # and compilation refuted it — `unresolved imports`. No new dependency
    # for all that: it is the SECOND feature of a crate already
    # present, and G1 adds no other.
    "Win32_System_Registry",
    "Win32_System_Pipes",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    # `IMMDevice::OpenPropertyStore` returns an `IPropertyStore`, which lives here:
    # without this feature the method itself does not exist on
    # `IMMDevice` (windows-rs replaces it with a `usize` in the vtable).
    # Needed to read the friendly name (`wasapi/rendu.rs`).
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
] }
# Virtual gamepad driver. Pure Rust crate: it talks to the ViGEmBus kernel
# driver through IOCTL, without a C SDK to embed. The
# "unstable_xtarget_notification" feature is needed to receive the rumble
# callbacks — without it, `request_notification` does not even exist on
# `Xbox360Wired` (checked on the published source code, docs.rs 0.1.4).
vigem-client = { version = "0.1", features = ["unstable_xtarget_notification"] }

[dev-dependencies]
# `test-util`: FROZEN tokio clock (`#[tokio::test(start_paused = true)]`),
# needed by the tests of `signaling::honour_suggested_retry` (correction
# round 1) — without it, testing a delay of several seconds
# would really wait those seconds. `full`, above, does NOT include it:
# it is a TEST feature, never linked into a production binary,
# hence its place here rather than in `[dependencies]`.
tokio = { version = "1", features = ["test-util"] }
